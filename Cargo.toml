[package]
name = "bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
actix-web = "4.18.1"
anyhow = "1.0.104"
handlebars = "6.4.4"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "default", "sqlite"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13.5", features = ["json", "rustls", "query"] }
